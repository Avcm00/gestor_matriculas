{% extends 'matriculas/base.html' %}
{% block title %}Nuevo Período{% endblock %}
{% block content %}
  <h2 class="text-xl font-semibold mb-4">Registrar Período Académico</h2>
  <form method="post" class="space-y-4">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <a href="{% url 'periodo_list' %}" class="btn btn-cancel">Cancelar</a>
      <button type="submit" class="btn btn-save">Guardar</button>
    </div>  </form>
{% endblock %}
