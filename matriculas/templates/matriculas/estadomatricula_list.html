{% extends 'matriculas/base.html' %}
{% block title %}Estados de Matrícula{% endblock %}
{% block content %}
  <a href="{% url 'estado_create' %}" class="btn btn-primary mb-3">
    Nuevo Estado
  </a>
  <table class="table table-bordered table-striped table-hover w-100">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-4 py-2">ID</th>
        <th class="px-4 py-2">Descripción</th>
        <th class="px-4 py-2">Acciones</th>

      </tr>
    </thead>
    <tbody>
      {% for obj in object_list %}
      <tr class="border-t">
        <td class="px-4 py-2">{{ obj.id }}</td>
        <td class="px-4 py-2">{{ obj.descripcion }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2" class="px-4 py-2 text-center">No hay estados registrados.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
