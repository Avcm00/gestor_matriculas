{% extends 'matriculas/base.html' %}
{% block title %}Registrar Pago{% endblock %}
{% block content %}
  <h2 class="text-xl font-semibold mb-4">Registrar Pago de Matrícula</h2>
  <form method="post" class="space-y-4">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <a href="{% url 'pago_list' %}" class="btn btn-cancel">
       Cancelar</a>
      <button type="submit" class="btn btn-primary mb-3">Guardar</button>
    </div>

  </form>
{% endblock %}
