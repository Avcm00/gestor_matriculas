{% extends 'matriculas/base.html' %}

{% block content %}
<!-- Modal -->
<div class="modal fade show d-block" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" style="background-color: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteModalLabel">¿Estás seguro?</h5>
      </div>
      <div class="modal-body text-center">
        <div class="mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="text-danger" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </div>
        <p class="mb-0">Esta acción no se puede deshacer.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="modal-footer justify-content-center">
          <button type="submit" class="btn btn-danger">Eliminar</button>
          <a href="{% url 'matricula_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
