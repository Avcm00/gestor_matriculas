{% extends 'matriculas/base.html' %}
{% block content %}
<div class="form-container">
  <h2>{{ object|yesno:"Editar Matrícula,Nueva Matrícula" }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="error">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="form-actions">
      <a href="{% url 'matricula_list' %}" class="btn btn-cancel">Cancelar</a>
      <button type="submit" class="btn btn-save">Guardar</button>
    </div>
  </form>
</div>
<style>
  .form-container {
    max-width: 600px;
    margin: 2rem auto;
    padding: 2rem;
    background-color: #f9f9f9;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }
  .form-group {
    margin-bottom: 1rem;
  }
  .form-group label {
    font-weight: bold;
    margin-bottom: 0.4rem;
    display: block;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .error {
    color: red;
    font-size: 0.875rem;
    margin-top: 0.3rem;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
    margin-top: 1.5rem;
  }
  .btn-cancel {
    background-color: #e74c3c;
    color: white;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    text-decoration: none;
    display: inline-block;
  }
  .btn-cancel:hover {
    background-color: #c0392b;
  }
  .btn-save {
    background-color: #2ecc71;
    color: white;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  .btn-save:hover {
    background-color: #27ae60;
  }
</style>
{% endblock %}
