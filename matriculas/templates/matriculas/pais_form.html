<!-- pais_form.html -->
{% extends 'matriculas/base.html' %}
{% block title %}Nuevo País{% endblock %}
{% block content %}
  <h2 class="text-xl font-semibold mb-4">Registrar País</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mb-3">
      Guardar
    </button>
  </form>
{% endblock %}
